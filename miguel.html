<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miguel – Be a Dog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6e9; --cream2:#ffe9cc; --ink:#1f1a17; --accent:#ff6b4a; --accent-sh:#c94a2e;
    --yellow:#ffc94a; --green:#5cc46a; --orange:#ff8f3a; --good:#3fbf5f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe2f7;color:var(--ink);
    font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;}
  canvas#main{display:block}
  button{font:inherit;font-weight:800;border:0;cursor:pointer}

  /* ---------- in-game HUD ---------- */
  .pill{background:rgba(255,246,233,.95);border-radius:999px;padding:6px 14px;font-weight:800;
    box-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap}
  #hud{position:fixed;inset:0;pointer-events:none}
  #hud > *{pointer-events:auto}
  #nameCard{position:fixed;top:12px;left:12px;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 8px}
  #nameCard .face{width:38px;height:38px;border-radius:50%;background:#1c1c22;display:grid;place-items:center;font-size:22px}
  #nameCard b{font-family:Bangers,cursive;font-size:24px;letter-spacing:1px}
  #badges{display:flex;gap:4px}
  #badges span{font-size:22px;filter:grayscale(1);opacity:.35;transition:all .3s}
  #badges span.done{filter:none;opacity:1;transform:scale(1.15)}
  #rightHud{position:fixed;top:12px;right:12px;display:flex;gap:8px;align-items:center}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#aaa}
  .dot.on{background:var(--good);box-shadow:0 0 0 4px rgba(63,191,95,.25)}
  #tiltW{width:64px;height:64px;border-radius:50%;background:rgba(255,246,233,.95);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .iconBtn{width:44px;height:44px;border-radius:50%;background:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.18);font-size:20px}
  #panel{position:fixed;top:84px;right:12px;width:250px;background:var(--cream);border-radius:18px;padding:14px;
    box-shadow:0 6px 0 rgba(0,0,0,.18);display:none;font-size:14px}
  #panel.open{display:block}
  #panel .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
  #panel button{background:var(--accent);color:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 var(--accent-sh)}
  #panel button.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 #d8c7b0}
  #panel .keys{font-size:12px;opacity:.75;line-height:1.5}
  #shakeMeter{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:6px 14px}
  #shakeMeter.show{display:flex}
  #shakeMeter svg{width:46px;animation:jiggle .25s infinite}
  #shakeMeter .bar{display:flex;gap:6px}
  #shakeMeter .bar i{width:18px;height:18px;border-radius:50%;background:#ddd;position:relative;overflow:hidden}
  #shakeMeter .bar i b{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
  #nametag{position:fixed;transform:translate(-50%,-100%);font-family:Bangers,cursive;font-size:18px;letter-spacing:1px;
    color:#fff;background:#1c1c22;padding:1px 10px;border-radius:999px;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.25)}
  #balloon,#hBalloon{position:fixed;transform:translate(-30%,-100%);background:#fff;border:3px solid #111;border-radius:22px;
    padding:10px 16px;font-family:"Comic Sans MS","Comic Neue",Bangers,cursive;font-weight:900;font-size:22px;
    white-space:nowrap;display:none;pointer-events:none;box-shadow:4px 4px 0 rgba(0,0,0,.25);animation:wob .5s ease-in-out infinite alternate}
  #balloon:after,#hBalloon:after{content:"";position:absolute;left:24%;bottom:-20px;border:12px solid transparent;border-top:18px solid #111}
  #balloon:before,#hBalloon:before{content:"";position:absolute;left:calc(24% + 3px);bottom:-13px;border:9px solid transparent;border-top:14px solid #fff;z-index:1}
  @keyframes wob{from{transform:translate(-30%,-100%) rotate(-2deg)}to{transform:translate(-30%,-104%) rotate(2deg)}}
  #hBalloon{font-size:20px}
  #emote{position:fixed;transform:translate(-50%,-100%);width:58px;height:58px;border-radius:50%;background:#fff;
    border:3px solid #111;display:none;place-items:center;font-size:32px;pointer-events:none;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
  #emote.show{display:grid;animation:emo .35s ease-out}
  @keyframes emo{from{transform:translate(-50%,-60%) scale(.3)}to{transform:translate(-50%,-100%) scale(1)}}
  #endCard{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:rgba(24,18,15,.55);padding:16px}
  #endCard.show{display:flex;animation:fadeIn 1.4s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #endCard h2{margin:0;font-family:Bangers,cursive;font-size:clamp(64px,12vw,140px);letter-spacing:6px;color:#fff;
    text-shadow:0 6px 0 var(--accent-sh),0 12px 0 rgba(0,0,0,.2)}
  #endCard .endRow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:10px 22px;font-size:40px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
  #endCard .endRow svg{width:40px}
  #again{width:96px;height:96px;border-radius:50%;background:var(--accent);box-shadow:0 8px 0 var(--accent-sh);display:grid;place-items:center}
  #again:active{transform:translateY(4px);box-shadow:0 4px 0 var(--accent-sh)}
  #win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
  #win.show{display:flex}
  #win div{font-size:120px;animation:pop 4.5s ease-out forwards;text-align:center;line-height:1}
  #win small{display:block;font-family:Bangers,cursive;font-size:56px;color:#fff;text-shadow:0 4px 0 var(--accent-sh),0 0 18px rgba(0,0,0,.4);letter-spacing:2px}
  @keyframes pop{0%{transform:scale(.2);opacity:0}12%{transform:scale(1.1);opacity:1}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}

  /* ---------- landing page ---------- */
  #landing{position:fixed;inset:0;overflow:auto;z-index:10;background:rgba(255,246,233,.86);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #landing.hidden{display:none}
  #previewCanvas{position:fixed;inset:0;z-index:11;pointer-events:none}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 18px 40px}
  header{text-align:center}
  .logo{font-family:Bangers,cursive;font-size:clamp(64px,11vw,128px);line-height:.9;letter-spacing:4px;color:#1c1c22;
    text-shadow:0 6px 0 var(--accent),0 12px 0 rgba(0,0,0,.12)}
  .tag{display:inline-block;margin-top:14px;font-family:Bangers,cursive;font-size:clamp(28px,4.4vw,46px);letter-spacing:3px;
    background:var(--accent);color:#fff;padding:2px 26px;border-radius:999px;box-shadow:0 6px 0 var(--accent-sh);transform:rotate(-2deg)}
  .goal{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px auto 6px;flex-wrap:wrap}
  .goal span{font-size:34px;background:#fff;border-radius:16px;width:58px;height:58px;display:grid;place-items:center;
    box-shadow:0 4px 0 rgba(0,0,0,.12);animation:bob 2.4s ease-in-out infinite}
  .goal span:nth-child(2){animation-delay:.2s}.goal span:nth-child(3){animation-delay:.4s}
  .goal span:nth-child(4){animation-delay:.6s}.goal span:nth-child(5){animation-delay:.8s}.goal span:nth-child(6){animation-delay:1s}
  .goal .trophy{width:76px;height:76px;font-size:48px;background:var(--yellow)}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .sect{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
  .sect.two{grid-template-columns:repeat(2,1fr)}
  .card{background:#fff;border-radius:24px;padding:14px;display:grid;grid-template-columns:1fr 34px 1.25fr;align-items:center;gap:6px;
    box-shadow:0 6px 0 rgba(0,0,0,.1)}
  .in{display:flex;flex-direction:column;align-items:center;gap:6px;perspective:340px}
  .mb{width:100%;max-width:120px;display:block}
  .mbWrap{width:100%;max-width:120px}
  .press circle{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{50%{transform:scale(1.25);filter:brightness(1.2)}}
  .tiltS{animation:tiltS 4s ease-in-out infinite;transform-style:preserve-3d}
  .tiltB{animation:tiltB 4s ease-in-out infinite;transform-style:preserve-3d}
  @keyframes tiltS{0%,100%{transform:rotateX(22deg)}25%{transform:rotateY(22deg)}50%{transform:rotateX(-22deg)}75%{transform:rotateY(-22deg)}}
  @keyframes tiltB{0%,100%{transform:rotateX(62deg)}25%{transform:rotateY(62deg)}50%{transform:rotateX(-62deg)}75%{transform:rotateY(-62deg)}}
  .jiggle{animation:jiggle .22s linear infinite}
  @keyframes jiggle{0%{transform:translate(-5px,2px) rotate(-8deg)}50%{transform:translate(5px,-2px) rotate(8deg)}100%{transform:translate(-5px,2px) rotate(-8deg)}}
  .gauge{width:70px}
  .arr{width:34px}
  .stage{position:relative;height:150px;border-radius:18px;background:radial-gradient(circle at 50% 80%,#ffe9cc,#fff6e9 70%)}
  .fx{position:absolute;right:8px;top:6px;font-size:26px;animation:bob 1.2s ease-in-out infinite}
  .fx.l{left:8px;right:auto}
  .dots{display:flex;gap:6px}
  .dots i{width:14px;height:14px;border-radius:50%;background:#e4dcd0}
  .dots.n3 i{animation:dot3 3s infinite}
  .dots.n3 i:nth-child(2){animation-name:dot3b}.dots.n3 i:nth-child(3){animation-name:dot3c}
  @keyframes dot3{0%,5%{background:#e4dcd0}10%,95%{background:var(--yellow)}100%{background:#e4dcd0}}
  @keyframes dot3b{0%,38%{background:#e4dcd0}43%,95%{background:var(--yellow)}100%{background:#e4dcd0}}
  @keyframes dot3c{0%,71%{background:#e4dcd0}76%,95%{background:var(--yellow)}100%{background:#e4dcd0}}
  .dots.n2 i{animation:dot2 2s infinite}
  .dots.n2 i:nth-child(2){animation-name:dot2b}
  @keyframes dot2{0%,5%{background:#e4dcd0}10%,92%{background:var(--accent)}100%{background:#e4dcd0}}
  @keyframes dot2b{0%,50%{background:#e4dcd0}55%,92%{background:var(--accent)}100%{background:#e4dcd0}}
  .spots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:150px;align-content:center}
  .spots span{font-size:34px;text-align:center;background:var(--cream);border-radius:14px;padding:6px 0;animation:bob 2s ease-in-out infinite}
  .spots span:nth-child(even){animation-delay:.5s}
  footer{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:30px}
  #lConnect{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:10px 18px;font-size:26px;
    box-shadow:0 5px 0 rgba(0,0,0,.15)}
  #lConnect svg{width:46px}
  #lConnect.on{outline:4px solid var(--good)}
  #play{width:110px;height:110px;border-radius:50%;background:var(--accent);box-shadow:0 8px 0 var(--accent-sh);
    display:grid;place-items:center;animation:breathe 1.6s ease-in-out infinite}
  #play:active{transform:translateY(4px);box-shadow:0 4px 0 var(--accent-sh)}
  @keyframes breathe{50%{transform:scale(1.07)}}
  @media (max-width:900px){ .sect,.sect.two{grid-template-columns:1fr} }
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:50;background:var(--cream)}
</style>
</head>
<body>

<!-- ======== HUD ======== -->
<div id="hud">
  <div id="nameCard" class="pill"><div class="face">🐶</div><b>MIGUEL</b>
    <div id="badges"><span data-id="bone">🦴</span><span data-id="oven">🍗</span><span data-id="sandal">🩴</span><span data-id="toilet">🚽</span><span data-id="shower">🚿</span><span data-id="balcony">🐈</span></div>
  </div>
  <div id="rightHud">
    <span class="pill"><i class="dot" id="dot"></i></span>
    <svg id="tiltW" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="#ffe2c4"/>
      <circle cx="32" cy="32" r="14" fill="#d8f0d8"/>
      <circle cx="32" cy="32" r="3.2" fill="#e8e8e8"/>
      <circle id="tiltDot" cx="32" cy="32" r="5" fill="#1c1c22"/>
    </svg>
    <button class="iconBtn" id="gear" title="Settings">⚙️</button>
  </div>
  <div id="panel">
    <div class="row"><button id="pConnect">🔌 Connect micro:bit</button></div>
    <div class="row"><button class="ghost" id="calBtn">🎯 Calibrate (hold flat)</button></div>
    <div class="row"><label><input type="checkbox" id="flipX"> flip ↔</label><label><input type="checkbox" id="flipY"> flip ↕</label></div>
    <div class="row"><label>🔊 <input type="range" id="vol" min="0" max="1" step="0.05"></label></div>
    <div class="row"><button class="ghost" id="homeBtn">🏠 Opening screen</button></div>
    <div class="keys">Keyboard: arrows walk · Shift+arrows run · Z = A · X = B · Z+X = A+B · hold Space = shake</div>
  </div>
  <div id="shakeMeter" class="pill">
    <svg viewBox="0 0 120 92"><rect x="4" y="6" width="112" height="72" rx="12" fill="#262626"/><rect x="10" y="74" width="100" height="14" rx="3" fill="#d9a441"/></svg>
    <div class="bar"><i><b></b></i><i><b></b></i></div>
  </div>
</div>
<div id="nametag">Miguel</div>
<div id="balloon">Please! No shower!</div>
<div id="hBalloon">Walk time, Miguel!</div>
<div id="emote"></div>
<div id="endCard">
  <h2>THE END</h2>
  <div class="endRow"><span>🏠</span><svg viewBox="0 0 40 24"><path d="M2 12h30M22 3l10 9-10 9" stroke="#1f1a17" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>🐕‍🦺</span><span>🚶</span><svg viewBox="0 0 40 24"><path d="M2 12h30M22 3l10 9-10 9" stroke="#1f1a17" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>🌳</span></div>
  <button id="again" title="Play again"><svg viewBox="0 0 40 40" width="50"><path d="M31 13a12 12 0 1 0 2 10" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M33 4v10H23" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<div id="win"><div>🏆🐶<small>GOOD BOY, MIGUEL!</small></div></div>

<!-- ======== LANDING ======== -->
<div id="landing">
  <div class="wrap">
    <header>
      <div class="logo">MIGUEL</div>
      <div class="tag">🐾 BE A DOG 🐾</div>
      <div class="goal"><span>🦴</span><span>🍗</span><span>🩴</span><span>🚽</span><span>🚿</span><span>🐈</span>
        <svg class="arr" viewBox="0 0 40 24"><path d="M2 12h30M22 3l10 9-10 9" stroke="#1f1a17" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="trophy">🏆</span></div>
    </header>
    <div id="cards"></div>
    <footer>
      <button id="lConnect" title="Connect micro:bit">🔌<span id="lMb"></span><i class="dot" id="lDot"></i></button>
      <button id="play" title="Play"><svg viewBox="0 0 40 40" width="54"><path d="M12 7l22 13-22 13z" fill="#fff"/></svg></button>
    </footer>
  </div>
</div>
<div id="err"><div><h1>😿</h1><p>Three.js couldn't load. Check the internet connection and reload.</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (!window.THREE) { document.getElementById('err').style.display = 'flex'; throw new Error('no three'); }

/* =========================================================
   helpers
   ========================================================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
function lerpAngle(a, b, k){
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * k;
}

/* ---------- safety kit ----------
   Every automatic event uses these tracked timers, so nothing can pile up
   or keep running after the game is over. */
const TIMERS = new Set();
function later(ms, fn){
  const id = setTimeout(() => { TIMERS.delete(id); try{ fn(); }catch(e){ console.error(e); } }, ms);
  TIMERS.add(id); return id;
}
function repeat(ms, times, fn){               // runs fn a fixed number of times, then stops by itself
  let n = 0;
  const id = setInterval(() => {
    try{ fn(n); }catch(e){ console.error(e); }
    if (++n >= times){ clearInterval(id); TIMERS.delete(id); }
  }, ms);
  TIMERS.add(id); return id;
}
function clearAllTimers(){ TIMERS.forEach(id => { clearTimeout(id); clearInterval(id); }); TIMERS.clear(); }
/* cheap materials: Lambert lighting is computed per vertex, far lighter on the graphics chip than PBR */
function LMat(o = {}){
  o = Object.assign({}, o);
  delete o.roughness; delete o.metalness;
  if (o.flatShading) return new THREE.MeshPhongMaterial(Object.assign(o, { shininess: 0 }));
  return new THREE.MeshLambertMaterial(o);
}

/* =========================================================
   sound effects (synthesised, no files needed)
   ========================================================= */
const sfx = (() => {
  let ctx = null, master = null, noiseBuf = null, showerSrc = null, showerGain = null, vacSrc = null, vacOsc = null, vacGain = null;
  let voices = 0;                 // live sound count, capped so sounds can never pile up
  let volume = store.get('miguelVol', 0.8);
  function ensure(){
    try{
      if (!ctx){
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = volume; master.connect(ctx.destination);
        const len = ctx.sampleRate * 2;
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
    }catch(e){}
  }
  function envelope(g, t0, vol, a, dur, shape){
    g.gain.setValueAtTime(0.0001, t0);
    if (shape === 'sus'){
      g.gain.linearRampToValueAtTime(vol, t0 + a);
      g.gain.setValueAtTime(vol, t0 + dur * 0.7);
      g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    } else {
      g.gain.exponentialRampToValueAtTime(vol, t0 + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    }
  }
  function tone({ type = 'sine', f0 = 440, f1, dur = .2, vol = .2, at = 0, a = .01, filt, q = 1, vib = 0, vibRate = 6, curve, shape = 'perc' }){
    if (!ctx || voices >= 32 || document.hidden) return;
    try{
      const t0 = ctx.currentTime + at;
      const o = ctx.createOscillator(); o.type = type;
      if (curve) o.frequency.setValueCurveAtTime(new Float32Array(curve), t0, dur);
      else { o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1 || f0, t0 + dur); }
      if (vib){
        const l = ctx.createOscillator(), lg = ctx.createGain();
        l.frequency.value = vibRate; lg.gain.value = vib; l.connect(lg); lg.connect(o.frequency);
        l.start(t0); l.stop(t0 + dur + .05);
      }
      let node = o;
      if (filt){ const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt; f.Q.value = q; node.connect(f); node = f; }
      const g = ctx.createGain(); envelope(g, t0, vol, a, dur, shape);
      node.connect(g); g.connect(master);
      voices++; o.onended = () => { voices = Math.max(0, voices - 1); };
      o.start(t0); o.stop(t0 + dur + .05);
    }catch(e){}
  }
  function noise({ dur = .1, vol = .2, at = 0, type = 'bandpass', f = 1000, f1, q = 1, a = .005, shape = 'perc' }){
    if (!ctx || voices >= 32 || document.hidden) return;
    try{
      const t0 = ctx.currentTime + at;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t0);
      if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      fl.Q.value = q;
      const g = ctx.createGain(); envelope(g, t0, vol, a, dur, shape);
      src.connect(fl); fl.connect(g); g.connect(master);
      voices++; src.onended = () => { voices = Math.max(0, voices - 1); };
      src.start(t0, Math.random() * 1.5); src.stop(t0 + dur + .05);
    }catch(e){}
  }
  const api = {
    ensure,
    pause(on){ try{ if (ctx) on ? ctx.suspend() : ctx.resume(); }catch(e){} },
    setVolume(v){ volume = v; store.set('miguelVol', v); if (master) master.gain.value = v; },
    getVolume(){ return volume; },
    bark(){
      noise({ dur: .13, vol: .45, f: 900, q: .8 });
      tone({ type: 'sawtooth', f0: 480, f1: 190, dur: .16, vol: .3, filt: 1400 });
      tone({ type: 'square', f0: 240, f1: 120, dur: .12, vol: .07, filt: 800 });
    },
    howl(){
      const c = [300, 360, 450, 520, 550, 556, 548, 556, 545, 520, 450, 340];
      tone({ type: 'sawtooth', curve: c, dur: 2.4, vol: .2, a: .2, filt: 1100, vib: 14, vibRate: 5.5, shape: 'sus' });
      tone({ type: 'sine', curve: c.map(x => x * 2), dur: 2.4, vol: .07, a: .25, vib: 22, vibRate: 5.5, shape: 'sus' });
    },
    scratch(){
      for (let i = 0; i < 16; i++){
        noise({ dur: .05, vol: .2, type: 'highpass', f: 2600, at: i * .12 });
        tone({ f0: 140, f1: 90, dur: .06, vol: .1, at: i * .12 });
      }
    },
    lick(){
      for (let i = 0; i < 7; i++){
        noise({ dur: .2, vol: .22, f: 500, f1: 1900, q: 3, at: i * .42 });
        tone({ f0: 260, f1: 520, dur: .1, vol: .06, at: i * .42 + .08 });
      }
    },
    chew(){
      [0, .13, .27].forEach(at => {
        noise({ dur: .07, vol: .25, f: 1700, q: .6, at: at + Math.random() * .03 });
        tone({ f0: 95, f1: 60, dur: .08, vol: .1, at });
      });
    },
    sniff(){ [0, .12, .24].forEach((at, i) => noise({ dur: .07, vol: .12 + i * .04, type: 'highpass', f: 3500, at })); },
    doorScratch(){
      noise({ dur: .1, vol: .2, f: 3000, q: 2 });
      tone({ type: 'triangle', f0: 120, f1: 100, dur: .05, vol: .1 });
    },
    whine(){ tone({ f0: 880, f1: 1150, dur: .55, vol: .09, vib: 25, vibRate: 9, a: .05, shape: 'sus' }); },
    cough(){
      [0, .28].forEach(at => {
        noise({ dur: .18, vol: .45, type: 'lowpass', f: 1200, at });
        tone({ type: 'sawtooth', f0: 220, f1: 140, dur: .15, vol: .14, filt: 900, at });
      });
    },
    whimper(){
      for (let i = 0; i < 3; i++)
        tone({ f0: 1000 - i * 80, f1: 650 - i * 60, dur: .42, vol: .1, vib: 30, vibRate: 10, at: i * .46, a: .04, shape: 'sus' });
    },
    lap(){
      tone({ f0: 420, f1: 1300, dur: .05, vol: .12 });
      noise({ dur: .04, vol: .1, f: 1400, q: 3 });
    },
    headShake(){
      for (let i = 0; i < 6; i++) noise({ dur: .07, vol: .2, type: 'lowpass', f: 500, at: i * .11 });
      [2600, 3200, 2900, 3500].forEach((f, i) => tone({ f0: f, f1: f * .98, dur: .25, vol: .05, at: i * .13 }));
    },
    meow(){ tone({ type: 'sawtooth', curve: [480, 620, 820, 760, 520], dur: .75, vol: .08, filt: 1700, q: 4, a: .05, shape: 'sus' }); },
    hiss(){ noise({ dur: .6, vol: .12, type: 'highpass', f: 3200, a: .05, shape: 'sus' }); },
    jump(){ tone({ type: 'triangle', f0: 260, f1: 620, dur: .18, vol: .1 }); },
    thud(){ tone({ f0: 120, f1: 60, dur: .12, vol: .2 }); },
    grab(){ tone({ type: 'triangle', f0: 700, f1: 1000, dur: .08, vol: .08 }); noise({ dur: .05, vol: .15, f: 1500 }); },
    fanfare(){ [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'square', f0: f, dur: .22, vol: .07, at: i * .14, filt: 2500 })); },
    doorCreak(){ tone({ type: 'sawtooth', curve: [150, 210, 170, 245, 190, 265], dur: 1.0, vol: .05, filt: 900, q: 6, a: .08, shape: 'sus' }); },
    keys(){ [0, .07, .15, .22, .3].forEach((at, i) => tone({ type: 'triangle', f0: 3200 + i * 260, f1: 3000 + i * 200, dur: .12, vol: .04, at })); },
    click(){ noise({ dur: .03, vol: .3, type: 'highpass', f: 4000 }); tone({ type: 'square', f0: 2200, f1: 1800, dur: .04, vol: .06 }); },
    happyBark(){ noise({ dur: .1, vol: .35, f: 1200, q: .8 }); tone({ type: 'sawtooth', f0: 640, f1: 320, dur: .13, vol: .25, filt: 1900 }); },
    endTune(){ [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: .26, vol: .08, at: i * .16 })); },
    vacuum(on){
      if (!ctx) return;
      try{
        if (on && !vacSrc){
          vacSrc = ctx.createBufferSource(); vacSrc.buffer = noiseBuf; vacSrc.loop = true;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
          vacOsc = ctx.createOscillator(); vacOsc.type = 'sawtooth'; vacOsc.frequency.value = 110;
          const of = ctx.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 400;
          vacGain = ctx.createGain(); vacGain.gain.setValueAtTime(0.0001, ctx.currentTime);
          vacGain.gain.linearRampToValueAtTime(.05, ctx.currentTime + .3);
          vacSrc.connect(f); f.connect(vacGain); vacOsc.connect(of); of.connect(vacGain); vacGain.connect(master);
          vacSrc.start(); vacOsc.start();
        } else if (!on && vacSrc){
          vacGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + .3);
          vacSrc.stop(ctx.currentTime + .35); vacOsc.stop(ctx.currentTime + .35); vacSrc = vacOsc = null;
        }
      }catch(e){}
    },
    shower(on){
      if (!ctx) return;
      try{
        if (on && !showerSrc){
          showerSrc = ctx.createBufferSource(); showerSrc.buffer = noiseBuf; showerSrc.loop = true;
          const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2500; f.Q.value = .5;
          showerGain = ctx.createGain(); showerGain.gain.setValueAtTime(0.0001, ctx.currentTime);
          showerGain.gain.linearRampToValueAtTime(.07, ctx.currentTime + .4);
          showerSrc.connect(f); f.connect(showerGain); showerGain.connect(master); showerSrc.start();
        } else if (!on && showerSrc){
          showerGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + .4);
          showerSrc.stop(ctx.currentTime + .45); showerSrc = null;
        }
      }catch(e){}
    }
  };
  return api;
})();

/* =========================================================
   Miguel – the dog model + pose animator (used in game and previews)
   ========================================================= */
const DOG_M = {
  fur:    LMat({ color: 0x1c1c22, roughness: .5, metalness: .08 }),
  furL:   LMat({ color: 0x2c2c35, roughness: .5, metalness: .08 }),
  nose:   LMat({ color: 0x050505, roughness: .2 }),
  eye:    LMat({ color: 0x6b3b12, roughness: .15 }),
  white:  LMat({ color: 0xffffff }),
  tongue: LMat({ color: 0xff7aa2, roughness: .4 }),
  collar: LMat({ color: 0xd32f2f, roughness: .6 }),
  tag:    LMat({ color: 0xffc83d, metalness: .6, roughness: .3 })
};
const STAND = { bodyY: .8, bodyTilt: 0, bodyRoll: 0, headX: 0, headY: 1.22, headZ: .95, headRX: 0, headRY: 0, headRZ: 0,
  fHipY: .66, fHipZ: .5, fLegX: 0, hHipY: .66, hLegX: 0, liftZ: 0, scratch: 0, tailY: 1.0, tailZ: -.8, tailTilt: -.7,
  jaw: 0, tongue: 0, ears: 0 };
const SIT = { ...STAND, bodyY: .42, bodyTilt: -.38, fHipY: .68, fHipZ: .48, hHipY: .34, hLegX: -1.3, headY: 1.32, headZ: .78,
  tailY: .45, tailZ: -.8, tailTilt: -1.5 };
const POSES = {
  stand: STAND,
  sit: SIT,
  howl:    { ...SIT, headY: 1.45, headZ: .62, headRX: -1.0, jaw: .45, ears: .15 },
  scratch: { ...SIT, headX: .32, headY: 1.05, headZ: .7, headRY: .3, headRZ: -.6, scratch: 1, ears: .3 },
  lick:    { ...SIT, headX: .5, headY: .62, headZ: -.25, headRX: .5, headRY: -1.9, liftZ: -1.0, tongue: 1 },
  lie:     { ...STAND, bodyY: .4, bodyTilt: .02, fHipY: .28, fHipZ: .55, fLegX: -1.45, hHipY: .28, hLegX: 1.4,
             headY: .58, headZ: 1.02, headRX: .12, tailY: .4, tailZ: -.85, tailTilt: -1.5, ears: .8 },
  sniff:   { ...STAND, headY: .8, headZ: 1.1, headRX: .65 },
  paw:     { ...SIT, headY: 1.38, headZ: .8, headRX: -.15 },
  drink:   { ...STAND, bodyTilt: .12, headY: .55, headZ: 1.22, headRX: .95, tongue: .6 },
  bark:    { ...STAND, headY: 1.3, headRX: -.3 }
};

const DOG_M_PREVIEW = Object.fromEntries(Object.entries(DOG_M).map(([k, m]) => [k, m.clone()]));
function createDog(M = DOG_M){
  const root = new THREE.Group();
  const add = (geo, m, x, y, z, parent) => {
    const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o;
  };
  const body = new THREE.Group(); root.add(body);
  add(new THREE.SphereGeometry(.5, 24, 16), M.fur, 0, 0, .55, body).scale.set(.85, .8, 1.5);
  add(new THREE.SphereGeometry(.42, 20, 14), M.fur, 0, .1, 1.05, body);
  const collar = add(new THREE.TorusGeometry(.26, .045, 8, 20), M.collar, 0, .3, 1.2, body);
  collar.rotation.x = Math.PI / 2 - .6;
  add(new THREE.SphereGeometry(.06, 10, 8), M.tag, 0, .08, 1.42, body);

  const head = new THREE.Group(); root.add(head);
  add(new THREE.SphereGeometry(.36, 22, 16), M.fur, 0, 0, 0, head);
  add(new THREE.BoxGeometry(.3, .13, .42), M.furL, 0, -.03, .36, head);
  add(new THREE.SphereGeometry(.08, 12, 10), M.nose, 0, 0, .58, head);
  const jaw = new THREE.Group(); jaw.position.set(0, -.1, .18); head.add(jaw);
  add(new THREE.BoxGeometry(.26, .08, .38), M.furL, 0, -.03, .19, jaw);
  const tongue = new THREE.Group(); tongue.position.set(0, 0, .3); jaw.add(tongue);
  add(new THREE.BoxGeometry(.13, .03, .26), M.tongue, 0, 0, .12, tongue);
  const mouth = new THREE.Group(); mouth.position.set(0, .03, .3); jaw.add(mouth);
  [-1, 1].forEach(s => {
    add(new THREE.SphereGeometry(.065, 12, 10), M.eye, s * .14, .09, .3, head);
    add(new THREE.SphereGeometry(.02, 6, 5), M.white, s * .13, .12, .36, head);
  });
  const ears = [-1, 1].map(s => {
    const e = new THREE.Group(); e.position.set(s * .28, .2, -.02); head.add(e);
    add(new THREE.BoxGeometry(.1, .42, .24), M.furL, 0, -.18, 0, e);
    e.userData.s = s; return e;
  });

  const legs = [];
  [[-.24, true], [.24, true], [-.24, false], [.24, false]].forEach(([x, front]) => {
    const hip = new THREE.Group(); root.add(hip);
    add(new THREE.CylinderGeometry(.11, .09, .6, 12), M.fur, 0, -.3, 0, hip);
    add(new THREE.SphereGeometry(.12, 12, 8), M.furL, 0, -.6, .05, hip).scale.set(1, .6, 1.3);
    hip.userData = { x, front }; legs.push(hip);
  });
  const tail = new THREE.Group(); root.add(tail);
  add(new THREE.CylinderGeometry(.04, .08, .65, 10), M.fur, 0, .32, 0, tail);

  const P = { ...STAND };
  let t = Math.random() * 10, walkPh = 0;

  function update(dt, s){
    t += dt;
    const tgt = POSES[s.pose] || STAND;
    const k = 1 - Math.exp(-dt * 7);
    for (const key in tgt) P[key] += (tgt[key] - P[key]) * k;

    const sp = s.speed || 0, run = !!s.run;
    walkPh += dt * sp * (run ? 2.1 : 3.3);
    const amp = Math.min(1, sp / 2.2) * (run ? .95 : .6);
    const phases = run ? [0, .5, Math.PI, Math.PI + .5] : [0, Math.PI, Math.PI, 0];
    const bounce = Math.abs(Math.sin(walkPh)) * (run ? .14 : .05) * amp;
    const be = s.barkEnv || 0, sh = s.shakeEnv || 0, co = s.coughEnv || 0;

    body.position.set(0, P.bodyY + bounce - co * .04, -.55);
    body.rotation.set(P.bodyTilt + (run ? Math.sin(walkPh) * .1 * amp : 0) + co * .12, 0, P.bodyRoll + Math.sin(t * 30) * .06 * sh);

    let hx = P.headX, hy = P.headY + bounce * .8 + be * .06, hz = P.headZ;
    let rx = P.headRX - be * .3 + co * .45, ry = P.headRY, rz = P.headRZ;
    if (s.howl){ rz += Math.sin(t * 1.6) * .06; }
    if (s.licking){ hy += Math.sin(t * 11) * .035; rx += Math.sin(t * 11) * .15; }
    if (s.sniff){ ry += Math.sin(t * 2.4) * .55; rx += Math.sin(t * 22) * .03; hy += Math.sin(t * 4.8) * .03; }
    if (s.lap){ hy += Math.sin(t * 9) * .04; rx += Math.sin(t * 9) * .08; }
    if (s.whimper){ hy += Math.sin(t * 4.5) * .02; rz += Math.sin(t * 1.3) * .08; }
    if (s.paw){ rx += Math.sin(t * 3) * .05; }
    if (s.pose === 'stand' && sp < .3 && !be && !sh && !s.chew) ry += Math.sin(t * .6) * .18;
    ry += Math.sin(t * 31) * .75 * sh; rz += Math.sin(t * 31 + 1.2) * .35 * sh;
    head.position.set(hx, hy, hz);
    head.rotation.set(rx, ry, rz);

    let jw = P.jaw + be * .55 + co * .35;
    if (s.howl) jw += Math.sin(t * 3) * .08;
    if (s.chew) jw = Math.max(jw, .1 + (Math.sin(t * 9) * .5 + .5) * .25);
    if (s.lap) jw = Math.max(jw, .25);
    if (s.licking) jw = Math.max(jw, .2);
    jaw.rotation.x = jw;

    let tg = P.tongue;
    if (s.lap) tg = 1;
    if (sp > 3 && !s.chew) tg = Math.max(tg, .7);
    tongue.scale.z = .01 + tg;
    tongue.rotation.x = (s.licking || s.lap) ? .2 + Math.sin(t * (s.lap ? 18 : 11)) * .5 : .35;
    tongue.visible = tg > .03;

    legs.forEach((l, i) => {
      const right = l.userData.x > 0;
      const swing = Math.sin(walkPh + phases[i]) * amp;
      if (l.userData.front){
        l.position.set(l.userData.x, P.fHipY, P.fHipZ);
        let lx = P.fLegX + swing;
        if (s.paw && right) lx = -1.25 + Math.sin(t * 12) * .45;
        l.rotation.set(lx, 0, 0);
        l.scale.y = 1;
      } else {
        l.position.set(l.userData.x, P.hHipY, -.5);
        let lx = P.hLegX + swing, lz = right ? 0 : P.liftZ;
        if (right && P.scratch > .01){ lx = lerp(lx, -2.25 + Math.sin(t * 24) * .28, P.scratch); lz = .3 * P.scratch; }
        l.rotation.set(lx, 0, lz);
        l.scale.y = right ? 1 + .35 * P.scratch : 1;
      }
    });

    ears.forEach(e => {
      const sd = e.userData.s;
      e.rotation.z = sd * (.35 + P.ears * .55) + Math.sin(t * 31) * .9 * sh * sd;
      e.rotation.x = P.ears * .35 + Math.sin(walkPh * 2) * .3 * amp + (s.howl ? -.2 : 0);
    });

    tail.position.set(0, P.tailY, P.tailZ);
    tail.rotation.x = P.tailTilt + (run ? -.3 : 0);
    const wagAmp = s.whimper ? .08 : (s.pose === 'lick' || s.pose === 'lie' ? .15 : .5);
    tail.rotation.z = Math.sin(t * (sp > .5 || be > 0 ? 15 : 7)) * wagAmp;
  }
  return { root, head, jaw, mouth, collar, update };
}

   so far things sit below the horizon and rise into view as he walks toward them */
const BEND = { center: { value: new THREE.Vector3() }, k: { value: .011 } };
function bendMaterial(m){
  if (!m || m.userData.bent) return;
  m.userData.bent = true;
  const sprite = !!m.isSpriteMaterial;
  m.onBeforeCompile = sh => {
    sh.uniforms.uBendC = BEND.center; sh.uniforms.uBendK = BEND.k;
    sh.vertexShader = 'uniform vec3 uBendC;\nuniform float uBendK;\n' + (sprite
      ? sh.vertexShader.replace('vec4 mvPosition = modelViewMatrix * vec4( 0.0, 0.0, 0.0, 1.0 );',
          'vec4 bw = modelMatrix * vec4( 0.0, 0.0, 0.0, 1.0 ); vec2 bd = bw.xz - uBendC.xz; bw.y -= dot( bd, bd ) * uBendK; vec4 mvPosition = viewMatrix * bw;')
      : sh.vertexShader.replace('#include <project_vertex>',
          'vec4 bw = modelMatrix * vec4( transformed, 1.0 ); vec2 bd = bw.xz - uBendC.xz; bw.y -= dot( bd, bd ) * uBendK; vec4 mvPosition = viewMatrix * bw; gl_Position = projectionMatrix * mvPosition;'));
  };
  m.customProgramCacheKey = () => sprite ? 'bend-sprite' : 'bend-mesh';
}
function bendY(v){ const dx = v.x - BEND.center.value.x, dz = v.z - BEND.center.value.z; v.y -= (dx * dx + dz * dz) * BEND.k.value; return v; }

const colliders = [];
const matCache = {};
const mat = c => matCache[c] || (matCache[c] = LMat({ color: c, roughness: .85 }));
function box(w, h, d, color, x, y, z, collide = false, parent = scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d, Math.max(1, Math.ceil(w / 1.2)), 1, Math.max(1, Math.ceil(d / 1.2))), typeof color === 'number' ? mat(color) : color);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m);
  if (collide) colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  return m;
}
function cyl(rt, rb, h, color, x, y, z, collide = false, seg = 20){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), typeof color === 'number' ? mat(color) : color);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
  if (collide){ const r = Math.max(rt, rb); colliders.push({ minX: x - r, maxX: x + r, minZ: z - r, maxZ: z + r }); }
  return m;
}
function canvasTex(draw, size = 256){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); if (g) draw(g, size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const checker = (a, b, n) => canvasTex((g, S) => {
  const s = S / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){ g.fillStyle = (i + j) % 2 ? a : b; g.fillRect(i * s, j * s, s, s); }
});
const planks = () => canvasTex((g) => {
  for (let i = 0; i < 8; i++){
    g.fillStyle = ['#c79e74', '#bf956a', '#cda67c', '#c39a70'][i % 4]; g.fillRect(0, i * 32, 256, 32);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, i * 32, 256, 2); g.fillRect((i * 97) % 256, i * 32, 2, 32);
  }
});
function floor(x1, z1, x2, z2, material){
  const f = new THREE.Mesh(new THREE.PlaneGeometry(x2 - x1, z2 - z1, Math.ceil(x2 - x1), Math.ceil(z2 - z1)), material);
  f.rotation.x = -Math.PI / 2; f.position.set((x1 + x2) / 2, .01, (z1 + z2) / 2); f.receiveShadow = true; scene.add(f);
}

// fraction (0..1) of the way from Miguel (x0,z0) to (x1,z1) before the first wall
function wallFree(x0, z0, x1, z1){
  let f = 1;
  for (const e of fadeWalls){
    const p0 = e.axis === 'z' ? z0 : x0, p1 = e.axis === 'z' ? z1 : x1;
    if ((p0 - e.c) * (p1 - e.c) >= 0) continue;
    const t = (e.c - p0) / (p1 - p0);
    const along = e.axis === 'z' ? x0 + (x1 - x0) * t : z0 + (z1 - z0) * t;
    if (along > e.a1 - .35 && along < e.a2 + .35) f = Math.min(f, t);
  }
  return f;
}

function pushOut(px, pz, r){
  let ox = 0, oz = 0;
  for (const c of colliders){
    const x = px + ox, z = pz + oz;
    const cx = clamp(x, c.minX, c.maxX), cz = clamp(z, c.minZ, c.maxZ);
    const dx = x - cx, dz = z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 < 1e-8){
      const l = x - c.minX, rr = c.maxX - x, u = z - c.minZ, dd = c.maxZ - z, m = Math.min(l, rr, u, dd);
      if (m === l) ox -= l + r; else if (m === rr) ox += rr + r; else if (m === u) oz -= u + r; else oz += dd + r;
    } else { const d = Math.sqrt(d2); ox += dx / d * (r - d); oz += dz / d * (r - d); }
  }
  return [ox, oz];
}

/* where (0..1) the segment a->b first enters box c grown by r; null if it doesn't */
function segEnter(ax, az, bx, bz, c, r){
  const dx = bx - ax, dz = bz - az;
  let t0 = 0, t1 = 1;
  for (const [p, d, lo, hi] of [[ax, dx, c.minX - r, c.maxX + r], [az, dz, c.minZ - r, c.maxZ + r]]){
    if (Math.abs(d) < 1e-9){ if (p < lo || p > hi) return null; continue; }
    let a = (lo - p) / d, b = (hi - p) / d;
    if (a > b){ const s = a; a = b; b = s; }
    t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    if (t0 > t1) return null;
  }
  return t0;
}

    if (tmin < 1){ const back = (1 - tmin) * k; pos.x -= f.x * back; pos.z -= f.z * back; }
  }
  const [ox, oz] = pushOut(pos.x, pos.z, .48);
  pos.x += ox; pos.z += oz;

/* =========================================================
   input: micro:bit (via receiver over Web Serial) + keyboard
   ========================================================= */
const mb = { connected: false, pitch: 0, roll: 0, a: false, b: false, s: false, last: 0,
  calP: store.get('miguelCalP', 0), calR: store.get('miguelCalR', 0) };
const flipX = document.getElementById('flipX'), flipY = document.getElementById('flipY');
flipX.checked = store.get('miguelFlipX', false); flipY.checked = store.get('miguelFlipY', false);
flipX.onchange = () => store.set('miguelFlipX', flipX.checked);
flipY.onchange = () => store.set('miguelFlipY', flipY.checked);

function setConn(on){
  document.getElementById('dot').classList.toggle('on', on);
  document.getElementById('lDot').classList.toggle('on', on);
  document.getElementById('lConnect').classList.toggle('on', on);
  document.getElementById('pConnect').textContent = on ? '✅ micro:bit connected' : '🔌 Connect micro:bit';
}
async function connectMicrobit(){
  sfx.ensure();
  if (!('serial' in navigator)){ alert('The micro:bit connection needs Chrome or Edge on a computer.'); return; }
  if (mb.connected) return;
  try{
    const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0d28 }] });
    await port.open({ baudRate: 115200 });
    mb.connected = true; setConn(true);
    readLoop(port);
  }catch(e){
    console.warn(e);
    if (e.name === 'SecurityError') alert('This preview window is not allowed to use USB.\n\nDownload miguel.html and open it in Chrome or Edge.');
    else if (e.name !== 'NotFoundError') alert('The micro:bit port is busy. Close MakeCode (or any other tab using it) and try again.');
  }
}
function readLoop(port){
  const dec = new TextDecoderStream();
  port.readable.pipeTo(dec.writable).catch(() => {});
  const reader = dec.readable.getReader();
  let buf = '';
  const finish = () => { mb.connected = false; setConn(false); };
  // each read schedules the next one only after data arrives (no loop that can spin)
  const next = () => reader.read().then(({ value, done }) => {
    if (done){ finish(); return; }
    buf += value;
    const lines = buf.split('\n');
    buf = lines.pop();
    lines.slice(-20).forEach(l => parseLine(l.trim()));   // only the latest lines matter
    if (buf.length > 500) buf = '';
    next();
  }).catch(finish);
  next();
}
function parseLine(line){
  const p = line.split(',');
  if (p.length < 5) return;
  const pitch = parseFloat(p[0]), roll = parseFloat(p[1]);
  if (isNaN(pitch) || isNaN(roll)) return;
  mb.pitch = pitch; mb.roll = roll; mb.a = p[2] === '1'; mb.b = p[3] === '1'; mb.s = p[4].trim() === '1';
  mb.last = performance.now();
}
if ('serial' in navigator) navigator.serial.addEventListener('disconnect', () => { mb.connected = false; setConn(false); });

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  sfx.ensure();
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (e.code === 'Escape') showLanding(true);
  if (!G.started && (e.code === 'Enter' || e.code === 'Space') && !e.repeat){ startGame(); G.waitRelease = true; }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function readControls(){
  const live = mb.connected && performance.now() - mb.last < 800;
  let vx = 0, vz = 0, mag = 0, px = 0, pz = 0;
  if (live){
    // smooth the raw tilt so small hand shakes don't jerk Miguel around
    const k = Math.min(1, (performance.now() - (mb.smT || 0)) / 1000 * 7);
    mb.smT = performance.now();
    mb.sx = lerp(mb.sx || 0, mb.roll - mb.calR, k);
    mb.sz = lerp(mb.sz || 0, mb.pitch - mb.calP, k);
    px = mb.sx; pz = mb.sz;
    if (flipX.checked) px = -px;
    if (flipY.checked) pz = -pz;
    mag = Math.min(90, Math.hypot(px, pz));
    if (mag > 0.001){ vx = px / Math.hypot(px, pz); vz = pz / Math.hypot(px, pz); }
  }
  const kx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  const kz = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
  if (kx || kz){
    const l = Math.hypot(kx, kz); vx = kx / l; vz = kz / l;
    mag = (keys.ShiftLeft || keys.ShiftRight) ? 80 : 45;
    px = vx * mag; pz = vz * mag;
  }
  return {
    live, vx, vz, mag, px, pz,
    A: (live && mb.a) || !!keys.KeyZ,
    B: (live && mb.b) || !!keys.KeyX,
    shake: (live && mb.s) || !!keys.Space
  };
}

function stepScript(dt, s){
  const st = G.script[0]; if (!st) return;
  if (!st.started){ st.started = true; st.from = pos.clone(); st.h0 = heading; if (st.onStart) st.onStart(); }
  st.t += dt;
  const p = Math.min(1, st.t / st.dur);
  s.pose = st.pose || 'stand';
  if (st.tick) st.tick(dt, s, p);
  if (st.to){
    const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    pos.x = lerp(st.from.x, st.to.x, e); pos.z = lerp(st.from.z, st.to.z, e);
    pos.y = lerp(st.from.y, st.to.y, e) + (st.arc || 0) * Math.sin(Math.PI * p);
  }
  if (st.h !== undefined) heading = lerpAngle(st.h0, st.h, Math.min(1, p * 1.6));
  if (st.walk) s.speed = 2.4;
  if (st.shake) s.shakeEnv = Math.min(1, p * 6, (1 - p) * 5);
  if (st.cough) s.coughEnv = Math.max(0, Math.sin(p * Math.PI * 4));
  if (st.t >= st.dur){ if (st.onEnd) st.onEnd(); G.script.shift(); }
}

function approach(target, dist){
  const d = V(target.x - pos.x, 0, target.z - pos.z);
  const len = d.length() || 1;
  const to = V(target.x - d.x / len * dist, 0, target.z - d.z / len * dist);
  return { to, h: Math.atan2(d.x, d.z) };
}
function glideTo(z){

function humanPose(dt, sp, bend, reach){

const leashSegs = [0, 1].map(() => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.022, .022, 1, 6), mat(0xd32f2f)); m.visible = false; scene.add(m); return m; });
const UPV = V(0, 1, 0);
function setSeg(m, a, b){

const MEET = V(-5.5, 0, 5.5), DOOR_IN = V(-5.5, 0, 7.0), OUTSIDE = V(-5.5, 0, 15);
function roomOf(x, z){ if (x > 6) return z < 2 ? 'B' : 'Bal'; if (z < -1) return x < -4 ? 'K' : x < 1 ? 'T' : 'S'; return 'L'; }
const EXITS = { K: [[-9, -1.8], [-9, -.2]], T: [[-1.5, -1.8], [-1.5, -.2]], S: [[3.5, -1.8], [3.5, -.2]], B: [[6.8, .5], [5.2, .5]], Bal: [[6.8, 5.25], [5.2, 5.25]] };
function pathToDoor(){
  const r = roomOf(pos.x, pos.z), pts = [];
  if (r !== 'L') EXITS[r].forEach(p => pts.push(V(p[0], 0, p[1])));
  const last = pts.length ? pts[pts.length - 1] : pos;
  if (last.x < -7.4 && last.z > .9 && last.z < 6.2){            // west of the sofa: go round its nearer end
    const zz = last.z < 3.5 ? .6 : 6.4;
    pts.push(V(-9.7, 0, zz), V(-7.0, 0, zz));
  }
  pts.push(V(-5.5, 0, 3.2), MEET.clone());

}
function dogSteer(E, target, sp, dt){
  const dx = target.x - pos.x, dz = target.z - pos.z, d = Math.hypot(dx, dz);
  if (d < .3) return true;
  heading = lerpAngle(heading, Math.atan2(dx, dz), Math.min(1, dt * 8));
  const step = Math.min(d, sp * dt), n = Math.max(1, Math.ceil(step / .08));
  for (let i = 0; i < n; i++){
    pos.x += dx / d * step / n; pos.z += dz / d * step / n;
    if (!E.noclip){ const [ox, oz] = pushOut(pos.x, pos.z, .42); pos.x += ox; pos.z += oz; }
  }
  E.chk += dt;
  if (E.chk > 1){
    if (Math.hypot(pos.x - E.last.x, pos.z - E.last.z) < .25) E.noclip = true;   // stuck behind furniture: slip past
    E.last.copy(pos); E.chk = 0;
  }
  return false;
}

function startEnding(){

function forceMeet(){

  G.script = []; G.engaged = null; G.action = null;
  if (showerOn){ showerOn = false; sfx.shower(false); }
  pos.copy(MEET); pos.y = 0; heading = 0;
  Object.assign(E, { phase: 'meet', t: 1, path: [], chk: 0, last: pos.clone(), noclip: false, door: 1, barks: 0, barkT: 0 });
  human.root.visible = true; human.root.position.copy(DOOR_IN); human.root.rotation.y = Math.PI;
}
function finishGame(){
  if (G.over) return;
  G.over = true;

  sfx.vacuum(false); if (showerOn){ showerOn = false; sfx.shower(false); }

function endingDrive(dt, s){
  const E = G.ending;
  E.t += dt;
  if (E.phase === 'begin'){
    G.action = null; G.pend = null;
    if (G.engaged){ disengage(); return; }          // let the current activity finish naturally first
    pos.y = 0;
    Object.assign(E, { phase: 'meet', t: 0, path: pathToDoor(), chk: 0, last: pos.clone(), noclip: false, door: 0, barks: 0, barkT: 0 });
    human.root.visible = true; human.root.position.copy(OUTSIDE); human.root.rotation.y = Math.PI; human.coil.visible = true;
    sfx.keys(); later(350, () => sfx.doorCreak());

  }
  const hp = human.root.position;
  if (E.phase === 'meet'){
    E.door = Math.min(1, E.door + dt * .8);
    let hs = 0;
    if (E.t > .6 && hp.z > DOOR_IN.z){ hs = 1.5; hp.z = Math.max(DOOR_IN.z, hp.z - hs * dt); }
    humanPose(dt, hs, 0, 0);

      if (dogSteer(E, E.path[0], 3.6, dt)){ E.path.shift(); E.noclip = false; E.chk = 0; E.last.copy(pos); }
      s.speed = 3.6;
    } else {
      heading = lerpAngle(heading, 0, Math.min(1, dt * 5));

    }

const shakeMeter = document.getElementById('shakeMeter'), shakeBars = shakeMeter.querySelectorAll('.bar b');
const nametag = document.getElementById('nametag'), balloon = document.getElementById('balloon');
const tiltDot = document.getElementById('tiltDot');
const camLook = V(0, 0, -1);

function project(v){
  const p = v.clone().project(camera);
  return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight, behind: p.z > 1 };
}

function update(dt){
  G.time += dt;
  const ctl = readControls();
  const s = { pose: 'stand', speed: 0 };

  // tilt widget
  tiltDot.setAttribute('cx', 32 + clamp(ctl.px / 90, -1, 1) * 28);
  tiltDot.setAttribute('cy', 32 + clamp(ctl.pz / 90, -1, 1) * 28);
  tiltDot.setAttribute('fill', ctl.mag > 70 ? '#ff6b4a' : ctl.mag > 20 ? '#3fbf5f' : '#1c1c22');

  // starting from the controller on the opening screen
  if (!G.started && (ctl.A || ctl.B) && ctl.live){ startGame(); G.waitRelease = true; }
  if (G.waitRelease && !ctl.A && !ctl.B) G.waitRelease = false;

  // --- buttons: wait a moment so A+B pressed together counts as A+B
  const canAct = G.started && !G.script.length && !G.action && !(G.engaged && G.engaged.locked) && !G.waitRelease && !G.ending;
  if (G.started && !G.waitRelease){
    if (!G.pend && ((ctl.A && !G.prevA) || (ctl.B && !G.prevB))) G.pend = { t: 0, a: false, b: false };
    if (G.pend){
      G.pend.t += dt; G.pend.a = G.pend.a || ctl.A; G.pend.b = G.pend.b || ctl.B;
      if (G.pend.t >= .18){
        const type = G.pend.a && G.pend.b ? 'lick' : G.pend.a ? 'howl' : 'scratch';
        if (canAct) startAction(type);
        G.pend = null;
      }
    }
  }
  G.prevA = ctl.A; G.prevB = ctl.B;

  // --- what Miguel is doing
  G.barkEnv = Math.max(0, G.barkEnv - dt * 5);
  if (!G.started){
    s.pose = 'stand';
  } else if (G.script.length){
    speed = 0;
    stepScript(dt, s);
  } else if (G.ending){
    speed = 0;
    endingDrive(dt, s);
  } else {
    if (G.engaged){ G.engaged.et += dt; G.engaged.behave(s, dt, G.engaged.et); }
    if (G.action){
      const a = G.action; a.t += dt; s.pose = a.pose; Object.assign(s, a.s);
      if (a.t >= a.dur) G.action = null;
    }
    const free = !G.action && !(G.engaged && G.engaged.locked);
    let target = 0, running = false;
    if (free && ctl.mag > 20 && !ctl.shake){
      running = ctl.mag > 70;
      target = running ? 6.0 : lerp(1.4, 3.2, (ctl.mag - 20) / 50);
      // forward = away from the camera, right = camera's right
      const sy = Math.sin(G.camYaw), cy = Math.cos(G.camYaw);
      const mx = sy * -ctl.vz - cy * ctl.vx, mz = cy * -ctl.vz + sy * ctl.vx;
      heading = lerpAngle(heading, Math.atan2(mx, mz), Math.min(1, dt * 8));
    }
    speed = free ? lerp(speed, target, Math.min(1, dt * 6)) : 0;
    if (speed > .01){
      const f = fwd();
      const n = Math.max(1, Math.ceil(speed * dt / .08));      // small steps so he never skips through anything
      for (let i = 0; i < n; i++){
        pos.x += f.x * speed * dt / n; pos.z += f.z * speed * dt / n;
        resolveBody(f);
      }
    }
    if (free){ s.speed = speed; s.run = running && speed > 4; }
    if (running && speed > 4 && !(G.engaged && G.engaged.id === 'bone')){
      G.barkT -= dt;
      if (G.barkT <= 0){ sfx.bark(); G.barkEnv = 1; G.barkT = .55; }
    } else G.barkT = .15;
  }
  s.barkEnv = G.barkEnv;

  // --- spots: stay 3 s to start
  const canZone = G.started && !G.engaged && !G.script.length && !G.action && !G.ending;
  zones.forEach((z, i) => {
    const w = z.where();
    const show = !!w && G.engaged !== z && !G.ending;
    z.ring.visible = z.sprite.visible = show;
    if (!show){ z.t = 0; return; }
    z.ring.position.set(w.x, (w.y > .5 ? w.y : 0) + .03, w.z);
    z.sprite.position.set(w.x, 2.15 + Math.sin(G.time * 2 + i) * .12, w.z);
    const d = Math.hypot(pos.x - w.x, pos.z - w.z);
    if (canZone){
      if (d < z.r){ if (z.armed) z.t += dt; } else { z.t = 0; z.armed = true; }
      if (z.armed && z.t >= 3){ z.t = 0; z.armed = false; engage(z); }
    } else if (d >= z.r){ z.armed = true; }
    const q = Math.round(Math.min(1, z.t / 3) * 40);
    if (q !== z.lastQ){ drawRing(z, q / 40); z.lastQ = q; }
    z.ring.material.opacity = .7 + Math.sin(G.time * 3 + i) * .25;
  });

  // --- shake for 2 s to stop
  if (ctl.shake) G.shakeT += dt; else G.shakeT = Math.max(0, G.shakeT - dt * 1.2);
  G.shakeT = Math.min(G.shakeT, 2.2);
  const shakeable = G.engaged && !G.script.length && !G.ending;
  if (shakeable && G.shakeT >= 2){ disengage(); G.shakeT = 0; }
  shakeMeter.classList.toggle('show', !!shakeable);
  if (shakeable){
    const p = G.shakeT / 2;
    shakeBars[0].style.transform = `scaleX(${clamp(p * 2, 0, 1)})`;
    shakeBars[1].style.transform = `scaleX(${clamp(p * 2 - 1, 0, 1)})`;
  }

  // --- apply to the model
  dog.update(dt, s);
  dog.root.position.set(pos.x, pos.y + (s.yOff || 0), pos.z);
  dog.root.rotation.y = heading;

  // --- automatic extras (Easter eggs + ending); none of these read the controller
  eggsUpdate(dt);
  if (G.ending) endingLate(dt);

  // --- world animation
  tvScreen.material.emissiveIntensity = .65 + Math.sin(G.time * 9) * .1 + Math.sin(G.time * 23) * .07;
  ovenLight.intensity = .45 + Math.sin(G.time * 5) * .08;
  water.position.y = .44 + Math.sin(G.time * 3) * .004;
  if (bone.parent === scene && !G.engaged) bone.rotation.y += dt * .2;

  drops.forEach((d, i) => {
    if (!showerOn && !d.m.visible) return;
    if (!d.m.visible || d.m.position.y < .15){
      if (!showerOn){ d.m.visible = false; return; }
      const a = Math.random() * Math.PI * 2, r = Math.random() * .2;
      d.m.position.set(5.2 + Math.cos(a) * r, 1.95 - Math.random() * 1.6, -9.4 + Math.sin(a) * r);
      d.m.visible = true; d.v = 4 + Math.random() * 2;
    }
    d.m.position.y -= d.v * dt;
  });
  tears.forEach(t => {
    if (t.life <= 0) return;
    t.life -= dt; t.v.y -= 6 * dt; t.m.position.addScaledVector(t.v, dt);
    if (t.life <= 0 || t.m.position.y < .02){ t.life = 0; t.m.visible = false; }
  });

  // cats
  const alarmed = G.engaged === zBalcony;
  const nearBalcony = pos.x > 6 && pos.z > 2;
  G.catT -= dt;
  if (G.catT <= 0){
    if (alarmed) sfx.hiss(); else if (nearBalcony && G.started) sfx.meow();
    G.catT = alarmed ? 1.6 + Math.random() * 1.5 : 3.5 + Math.random() * 3;
  }
  cats.forEach((c, i) => {
    c.a = lerp(c.a, alarmed ? 1 : 0, Math.min(1, dt * 4));
    c.ph += dt;
    c.body.scale.y = 1.25 + c.a * .3;
    c.tail.rotation.x = lerp(-1.1 + Math.sin(c.ph * 2 + i) * .3, -.1, c.a);
    c.tail.rotation.z = Math.sin(c.ph * 1.5 + i) * .4 * (1 - c.a) + Math.sin(c.ph * 20) * .08 * c.a;
    c.ears.forEach((e, k) => { e.rotation.z = (k ? -1 : 1) * c.a * .9; });
    const look = Math.atan2(pos.x - c.g.position.x, pos.z - c.g.position.z) - c.g.rotation.y;
    c.head.rotation.y = lerpAngle(c.head.rotation.y, clamp(lerpAngle(0, look, 1), -1.2, 1.2), Math.min(1, dt * 3));
    c.head.rotation.z = Math.sin(c.ph * .8 + i * 2) * .15 * (1 - c.a);
    c.hop = alarmed ? Math.max(0, Math.sin(c.ph * 6 + i * 2)) * .12 : 0;
    c.g.position.y = 1.4 + c.hop;
  });

  // the world curves around Miguel
  BEND.center.value.set(pos.x, 0, pos.z);

  // camera: close behind Miguel's shoulder; swings to his front for actions and activities
  if (G.started){
    const busy = !!(G.action || G.script.length || (G.engaged && G.engaged.locked) || G.ending);
    const tall = innerWidth / innerHeight < 1;
    const diff = Math.abs(lerpAngle(0, heading - G.camYaw, 1));
    if (busy) G.camYaw = lerpAngle(G.camYaw, heading + (G.ending ? (G.ending.phase === 'out' || G.ending.phase === 'done' ? 0 : -.75) : .75), Math.min(1, dt * 1.5));
    else if (speed > .3 && diff < 2.0) G.camYaw = lerpAngle(G.camYaw, heading, Math.min(1, dt * 2.2 * Math.min(1, speed / 2)));
    // a bit further back, and always above the wall tops (1.8 m) so it can never sit inside a wall;
    // walls between the camera and Miguel fade out below
    const dist = (busy ? 4.6 : 5.6) * (tall ? 1.3 : 1);
    const hgt = (busy ? 2.7 : 3.2) * (tall ? 1.2 : 1);
    const cfx = Math.sin(G.camYaw), cfz = Math.cos(G.camYaw);
    camera.position.lerp(V(pos.x - cfx * dist, pos.y + hgt, pos.z - cfz * dist), Math.min(1, dt * 3));
    camera.position.y = Math.max(camera.position.y, 2.5);
    const look = busy ? V(pos.x, pos.y + .7, pos.z) : V(pos.x + cfx * 3.0, pos.y + .6, pos.z + cfz * 3.0);
    camLook.lerp(look, Math.min(1, dt * 5));
    camera.lookAt(camLook);
  } else {
    const a = G.time * .08;
    camera.position.set(pos.x + Math.sin(a) * 30, 24, pos.z + Math.cos(a) * 30);
    camera.lookAt(pos.x, -4, pos.z);
  }

  // (safety net) fade any wall that still stands between the camera and Miguel
  const cam = camera.position;
  const fadeTargets = human.root.visible ? [pos, human.root.position] : [pos];
  fadeWalls.forEach(e => {
    let hide = false;
    if (G.started) for (const tp of fadeTargets){
      const p0 = e.axis === 'z' ? tp.z : tp.x, p1 = e.axis === 'z' ? cam.z : cam.x;
      if ((p0 - e.c) * (p1 - e.c) < 0 || Math.abs(p1 - e.c) < .6){
        const t = Math.abs(p1 - p0) < 1e-4 ? 1 : clamp((e.c - p0) / (p1 - p0), 0, 1);
        const along = e.axis === 'z' ? tp.x + (cam.x - tp.x) * t : tp.z + (cam.z - tp.z) * t;
        if (along > e.a1 - .5 && along < e.a2 + .5) hide = true;
      }
    }
    e.o = lerp(e.o, hide ? .15 : 1, Math.min(1, dt * 8));
    e.mats.forEach(m => { m.opacity = e.o; m.depthWrite = e.o > .95; });
  });

  // name tag & speech balloon
  const crying = G.engaged === zShower;
  const headP = project(bendY(dog.head.getWorldPosition(V(0, 0, 0)).add(V(0, .75, 0))));
  nametag.style.display = 'none';
  nametag.style.left = headP.x + 'px'; nametag.style.top = headP.y + 'px';
  balloon.style.display = G.started && crying ? 'block' : 'none';
  balloon.style.left = headP.x + 'px'; balloon.style.top = (headP.y - 10) + 'px';
  emoteT -= dt;
  if (emoteT <= 0 || !G.started) emoteEl.classList.remove('show');
  emoteEl.style.left = headP.x + 'px'; emoteEl.style.top = (headP.y - 6) + 'px';
  hSayT -= dt;
  hBalloon.style.display = G.started && hSayT > 0 && human.root.visible ? 'block' : 'none';
  if (hSayT > 0){
    const hp = project(bendY(human.head.getWorldPosition(V(0, 0, 0)).add(V(0, .45, 0))));
    hBalloon.style.left = hp.x + 'px'; hBalloon.style.top = hp.y + 'px';
  }
}

/* =========================================================
   landing cards with live 3D previews
   ========================================================= */
function mbSVG(a, b){
  const lit = new Set(['0,1', '0,3', '1,0', '1,1', '1,2', '1,3', '1,4', '2,0', '2,1', '2,2', '2,3', '2,4', '3,1', '3,2', '3,3', '4,2']);
  let leds = '';
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++)
    leds += `<rect x="${44 + c * 7}" y="${20 + r * 7}" width="4.5" height="4.5" rx="1" fill="${lit.has(r + ',' + c) ? '#ff5a4a' : '#444'}"/>`;
  const btn = (x, label, on) => `<g class="${on ? 'press' : ''}"><circle cx="${x}" cy="40" r="11" fill="${on ? '#ff6b4a' : '#5a5a5a'}" stroke="${on ? '#fff' : 'none'}" stroke-width="2"/>
    <text x="${x}" y="45" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Arial">${label}</text></g>`;
  return `<svg class="mb" viewBox="0 0 120 92"><rect x="4" y="4" width="112" height="72" rx="12" fill="#262626"/>
    <rect x="10" y="72" width="100" height="16" rx="3" fill="#d9a441"/>${[0, 1, 2, 3, 4].map(i => `<rect x="${18 + i * 21}" y="74" width="6" height="12" rx="1" fill="#b98226"/>`).join('')}
    ${leds}${btn(20, 'A', a)}${btn(100, 'B', b)}</svg>`;
}
function gaugeSVG(band){
  const R = 48, cx = 10, cy = 56;
  const pt = d => [cx + R * Math.cos(d * Math.PI / 180), cy - R * Math.sin(d * Math.PI / 180)];
  const arc = (d0, d1, col, on) => { const [x0, y0] = pt(d0), [x1, y1] = pt(d1);
    return `<path d="M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 0 0 ${x1} ${y1} Z" fill="${col}" opacity="${on ? 1 : .2}"/>`; };
  const needle = [10, 45, 80][band], [nx, ny] = pt(needle);
  return `<svg class="gauge" viewBox="0 0 64 62">${arc(0, 20, '#9e9e9e', band === 0)}${arc(20, 70, '#5cc46a', band === 1)}${arc(70, 90, '#ff8f3a', band === 2)}
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#1f1a17" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="#1f1a17"/></svg>`;
}
const ARROW = `<svg class="arr" viewBox="0 0 40 24"><path d="M2 12h30M22 3l10 9-10 9" stroke="#1f1a17" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SOUND = `<svg viewBox="0 0 30 30" width="30"><path d="M8 9a8 8 0 0 1 0 12M13 5a14 14 0 0 1 0 20M18 1a20 20 0 0 1 0 28" stroke="#ff6b4a" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
const RING = `<svg viewBox="0 0 100 100" style="width:84px"><circle cx="50" cy="50" r="40" fill="#fff3d6" stroke="#ffc94a" stroke-width="9"/>
  <path d="M50 10 A40 40 0 1 1 15.4 70" stroke="#ff8f00" stroke-width="10" fill="none" stroke-linecap="round"/><text x="50" y="62" font-size="34" text-anchor="middle">🐾</text></svg>`;

const CARDS = [
  [
    { input: mbSVG(true, false), mode: 'howl', fx: '🌕' },
    { input: mbSVG(false, true), mode: 'scratch', fx: '💫' },
    { input: mbSVG(true, true), mode: 'lick', fx: '👅' }
  ],
  [
    { input: `<div class="mbWrap">${mbSVG(false, false)}</div>${gaugeSVG(0)}`, mode: 'idle', fx: '' },
    { input: `<div class="mbWrap tiltS">${mbSVG(false, false)}</div>${gaugeSVG(1)}`, mode: 'walk', fx: '🐾' },
    { input: `<div class="mbWrap tiltB">${mbSVG(false, false)}</div>${gaugeSVG(2)}`, mode: 'run', fx: SOUND, fxL: '💨' }
  ],
  [
    { input: `${RING}<div class="dots n3"><i></i><i></i><i></i></div>`, spots: true },
    { input: `<div class="mbWrap jiggle">${mbSVG(false, false)}</div><div class="dots n2"><i></i><i></i></div>`, mode: 'shake', fx: '💦' }
  ]
];
const cardsEl = document.getElementById('cards');
CARDS.forEach(row => {
  const sec = document.createElement('div'); sec.className = 'sect' + (row.length === 2 ? ' two' : '');
  row.forEach(c => {
    const card = document.createElement('div'); card.className = 'card';
    const out = c.spots
      ? `<div class="spots"><span>🦴</span><span>🍗</span><span>🩴</span><span>🚽</span><span>🚿</span><span>🐈</span></div>`
      : `<div class="stage" data-mode="${c.mode}">${c.fx ? `<div class="fx">${c.fx}</div>` : ''}${c.fxL ? `<div class="fx l">${c.fxL}</div>` : ''}</div>`;
    card.innerHTML = `<div class="in">${c.input}</div>${ARROW}${out}`;
    sec.appendChild(card);
  });
  cardsEl.appendChild(sec);
});
document.getElementById('lMb').innerHTML = mbSVG(false, false);

const previewR = new THREE.WebGLRenderer({ canvas: previewCanvas, antialias: true, alpha: true });
previewR.setPixelRatio(1);
previewR.setSize(innerWidth, innerHeight);
previewR.setClearColor(0x000000, 0);
const previews = [];
document.querySelectorAll('.stage').forEach(el => {
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0x9a7b5c, .9));
  const dl = new THREE.DirectionalLight(0xffffff, .6); dl.position.set(3, 6, 4); sc.add(dl);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1.6, 32), LMat({ color: 0xf2d7b3 }));
  disc.rotation.x = -Math.PI / 2; sc.add(disc);
  const d = createDog(DOG_M_PREVIEW); d.root.rotation.y = .55; sc.add(d.root);
  const cam = new THREE.PerspectiveCamera(30, 1.4, .1, 50);
  cam.position.set(3.4, 2.3, 4.6); cam.lookAt(0, .72, 0);
  previews.push({ el, scene: sc, cam, dog: d, mode: el.dataset.mode, t: Math.random() * 2 });
});
function previewState(p, dt){
  p.t += dt;
  const s = { pose: 'stand', speed: 0 };
  switch (p.mode){
    case 'howl': s.pose = 'howl'; s.howl = true; break;
    case 'scratch': s.pose = 'scratch'; break;
    case 'lick': s.pose = 'lick'; s.licking = true; break;
    case 'walk': s.speed = 2.6; break;
    case 'run': s.speed = 6; s.run = true; s.barkEnv = Math.max(0, 1 - (p.t % .55) * 5); break;
    case 'shake': { const c = p.t % 2.2; s.shakeEnv = c < 1 ? Math.min(1, c * 6, (1 - c) * 5) : 0; break; }
  }
  return s;
}
function renderPreviews(dt){
  previewR.setScissorTest(false); previewR.clear();
  previewR.setScissorTest(true);
  previews.forEach(p => {
    p.dog.update(dt, previewState(p, dt));
    const r = p.el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight || r.width < 2) return;
    const x = r.left, y = innerHeight - r.bottom;
    previewR.setViewport(x, y, r.width, r.height);
    previewR.setScissor(x, y, r.width, r.height);
    p.cam.aspect = r.width / r.height; p.cam.updateProjectionMatrix();
    previewR.render(p.scene, p.cam);
  });
}

/* =========================================================
   loop
   ========================================================= */
scene.traverse(o => { if (o.material) [].concat(o.material).forEach(bendMaterial); });
const clock = new THREE.Clock();
/* PERF: level 2 = full, 1 = no shadows, 0 = no shadows + no mirror + lower resolution + 30 fps */
const PERF = { level: 2, ema: 16, slowFor: 0, frame: 0, last: 0, halt: false, crashed: false };
function setQuality(level){
  PERF.level = level;
  sun.castShadow = level >= 2;
  renderer.setPixelRatio(level >= 1 ? 1 : .75);
  renderer.setSize(innerWidth, innerHeight);
  console.info('Miguel: graphics level', level);
}
function showCrash(){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(24,18,15,.7);color:#fff;font:800 22px "Baloo 2",sans-serif;text-align:center;padding:16px';
  d.innerHTML = '<div>😿<br>The game stopped to keep your computer safe.<br><button style="margin-top:14px;padding:10px 22px;border-radius:999px;background:#ff6b4a;color:#fff;font:inherit">Reload</button></div>';
  d.querySelector('button').onclick = () => location.reload();
  document.body.appendChild(d);
}
function loop(now){
  if (PERF.halt || PERF.crashed) return;               // the end screen and errors stop the loop completely
  requestAnimationFrame(loop);
  if (document.hidden) return;                          // nothing runs while the tab is in the background
  const gap = PERF.level >= 1 ? 1000 / 61 : 1000 / 31;  // never more than 60 frames a second (30 on the lowest level)
  if (now - PERF.last < gap) return;
  const frameMs = PERF.last ? now - PERF.last : 16;
  PERF.last = now;
  try{
    const dt = Math.min(clock.getDelta(), .05);
    update(dt);
    PERF.frame++;
    if (PERF.level >= 1 && PERF.frame % 3 === 0) renderMirror();          // mirror at 20 fps
    renderer.render(scene, camera);
    if (!landing.classList.contains('hidden') && PERF.frame % 2 === 0) renderPreviews(dt * 2);
  }catch(e){
    PERF.crashed = true; clearAllTimers(); clearInterval(eggTicker); sfx.pause(true);
    console.error(e); showCrash(); return;
  }
  // automatic quality: if the computer keeps struggling for 3 seconds, lower the detail one step
  PERF.ema = PERF.ema * .95 + Math.min(frameMs, 250) * .05;
  PERF.slowFor = PERF.ema > 40 ? PERF.slowFor + frameMs / 1000 : 0;
  if (PERF.slowFor > 3 && PERF.level > 0){ setQuality(PERF.level - 1); PERF.slowFor = 0; PERF.ema = 20; }
}
document.addEventListener('visibilitychange', () => {
  sfx.pause(document.hidden);
  if (!document.hidden){ clock.getDelta(); PERF.last = 0; }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); previewR.setSize(innerWidth, innerHeight);
});
showLanding(true);
requestAnimationFrame(loop);
</script>
